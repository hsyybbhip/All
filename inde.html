<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Flappy Birf</title>
    <style>
        :root {
            color-scheme: light dark;
            --bg: radial-gradient(circle at 20% 20%, #9be7ff 0%, #6ec3ff 30%, #3f8efc 100%);
            --card: rgba(255, 255, 255, 0.75);
            --text: #0f172a;
            --accent: #ffca28;
            --shadow: 0 24px 48px rgba(15, 23, 42, 0.25);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: radial-gradient(circle at 20% 20%, #334155 0%, #1e293b 60%, #0f172a 100%);
                --card: rgba(15, 23, 42, 0.72);
                --text: #e2e8f0;
                --accent: #fbbf24;
                --shadow: 0 20px 44px rgba(0, 0, 0, 0.45);
            }
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Inter", "Segoe UI", system-ui, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            color: var(--text);
            padding: 24px;
        }

        .game-wrapper {
            width: min(520px, 100%);
            display: grid;
            gap: 18px;
            justify-items: center;
            text-align: center;
        }

        .panel {
            width: 100%;
            background: var(--card);
            backdrop-filter: blur(16px);
            border-radius: 18px;
            padding: 20px 24px;
            box-shadow: var(--shadow);
        }

        h1 {
            margin: 0 0 8px;
            font-size: clamp(2.2rem, 5vw, 3rem);
            letter-spacing: -0.02em;
        }

        .tagline {
            margin: 0;
            opacity: 0.78;
        }

        canvas {
            width: 100%;
            height: auto;
            max-width: 440px;
            border-radius: 16px;
            border: 4px solid rgba(255, 255, 255, 0.55);
            background:
                linear-gradient(#87ceeb 0%, #e0f6ff 45%, #c1f0ff 100%);
            box-shadow: var(--shadow);
        }

        .scoreboard {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 12px;
            margin-top: 12px;
        }

        .stat {
            background: rgba(255, 255, 255, 0.55);
            border-radius: 14px;
            padding: 12px;
            font-weight: 600;
            color: #1f2937;
        }

        .stat span {
            display: block;
            font-size: 0.75rem;
            opacity: 0.65;
            margin-top: 4px;
        }

        @media (prefers-color-scheme: dark) {
            .stat {
                background: rgba(15, 23, 42, 0.6);
                color: #e2e8f0;
            }

            canvas {
                border-color: rgba(148, 163, 184, 0.36);
            }
        }

        .hint {
            margin: 0;
            font-size: 0.95rem;
            opacity: 0.85;
        }

        .actions {
            margin-top: 16px;
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        button {
            border: none;
            border-radius: 999px;
            padding: 10px 20px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            background: var(--accent);
            color: #1c1917;
            box-shadow: 0 16px 32px rgba(0, 0, 0, 0.18);
            transition: transform 160ms ease, box-shadow 160ms ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 36px rgba(0, 0, 0, 0.22);
        }

        button:active {
            transform: translateY(1px);
        }

        .ghost {
            background: rgba(255, 255, 255, 0.6);
        }
    </style>
</head>
<body>
    <div class="game-wrapper">
        <div class="panel">
            <h1>Flappy Birf</h1>
            <p class="tagline">Tap, click, or space-bar to keep Birf in the sky. Dodge the pipes, rack up points!</p>
        </div>

        <canvas id="game" width="360" height="600" aria-label="Flappy Birf game area" role="img"></canvas>

        <div class="panel">
            <div class="scoreboard">
                <div class="stat">
                    <div id="score">0</div>
                    <span>Score</span>
                </div>
                <div class="stat">
                    <div id="best">0</div>
                    <span>Best</span>
                </div>
                <div class="stat">
                    <div id="status">Ready</div>
                    <span>Status</span>
                </div>
            </div>
            <p class="hint">Press <strong>space</strong>, tap, or click the canvas to flap. Avoid touching pipes or the ground. Good luck, pilot!</p>
            <div class="actions">
                <button id="startButton">Start</button>
                <button id="pauseButton" class="ghost">Pause</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d");
        const scoreEl = document.getElementById("score");
        const bestEl = document.getElementById("best");
        const statusEl = document.getElementById("status");
        const startButton = document.getElementById("startButton");
        const pauseButton = document.getElementById("pauseButton");

        const GROUND_HEIGHT = 80;
        const BIRD = {
            x: canvas.width * 0.3,
            y: canvas.height / 2,
            radius: 18,
            velocity: 0
        };

        const SETTINGS = {
            gravity: 0.35,
            jumpStrength: -7.8,
            pipeSpeed: 2.8,
            pipeGap: 150,
            pipeWidth: 70,
            spawnInterval: 1500
        };

        const COLORS = {
            bird: "#ffec99",
            wing: "#fbbf24",
            eye: "#1f2937",
            pipe: "#38bdf8",
            pipeDark: "#0284c7",
            ground: "#9f7a54",
            grass: "#22c55e"
        };

        let pipes = [];
        let lastSpawn = 0;
        let score = 0;
        let bestScore = Number(localStorage.getItem("flappy-birf-best")) || 0;
        let animationId = null;
        let lastTime = 0;
        let state = "ready"; // ready, playing, paused, dead

        bestEl.textContent = bestScore.toString();

        function resetGame() {
            pipes = [];
            score = 0;
            BIRD.y = canvas.height / 2;
            BIRD.velocity = 0;
            lastSpawn = 0;
            lastTime = performance.now();
            scoreEl.textContent = "0";
            updateStatus("Ready");
            renderFrame(lastTime);
        }

        function startGame() {
            if (state === "playing") {
                return;
            }
            if (state === "dead") {
                resetGame();
            }
            state = "playing";
            updateStatus("Flying");
            lastTime = performance.now();
            cancelAnimationFrame(animationId);
            animationId = requestAnimationFrame(loop);
        }

        function pauseGame() {
            if (state !== "playing") {
                return;
            }
            state = "paused";
            updateStatus("Paused");
            cancelAnimationFrame(animationId);
        }

        function resumeGame() {
            if (state !== "paused") {
                return;
            }
            state = "playing";
            updateStatus("Flying");
            lastTime = performance.now();
            animationId = requestAnimationFrame(loop);
        }

        function handlePauseClick() {
            if (state === "playing") {
                pauseGame();
                pauseButton.textContent = "Resume";
            } else if (state === "paused") {
                resumeGame();
                pauseButton.textContent = "Pause";
            }
        }

        function updateStatus(text) {
            statusEl.textContent = text;
        }

        function spawnPipe() {
            const margin = 50;
            const maxGapCenter = canvas.height - GROUND_HEIGHT - margin;
            const minGapCenter = margin;
            const gapCenter = Math.random() * (maxGapCenter - minGapCenter) + minGapCenter;
            pipes.push({
                x: canvas.width + SETTINGS.pipeWidth,
                gapCenter,
                scored: false
            });
        }

        function flap() {
            if (state === "ready") {
                startGame();
            }
            if (state !== "playing" && state !== "paused") {
                return;
            }
            if (state === "paused") {
                resumeGame();
            }
            BIRD.velocity = SETTINGS.jumpStrength;
        }

        function loop(timestamp) {
            const delta = timestamp - lastTime;
            lastTime = timestamp;

            update(delta);
            renderFrame(timestamp);

            if (state === "playing") {
                animationId = requestAnimationFrame(loop);
            }
        }

        function update(delta) {
            if (state !== "playing") {
                return;
            }

            BIRD.velocity += SETTINGS.gravity;
            BIRD.y += BIRD.velocity;

            if (BIRD.y - BIRD.radius < 0) {
                BIRD.y = BIRD.radius;
                BIRD.velocity = 0;
            }

            pipes.forEach(pipe => {
                pipe.x -= SETTINGS.pipeSpeed;
            });

            pipes = pipes.filter(pipe => pipe.x + SETTINGS.pipeWidth > -10);

            if (lastSpawn === 0 || performance.now() - lastSpawn > SETTINGS.spawnInterval) {
                spawnPipe();
                lastSpawn = performance.now();
            }

            pipes.forEach(pipe => {
                const halfGap = SETTINGS.pipeGap / 2;
                const topPipeBottom = pipe.gapCenter - halfGap;
                const bottomPipeTop = pipe.gapCenter + halfGap;

                if (!pipe.scored && pipe.x + SETTINGS.pipeWidth < BIRD.x - BIRD.radius) {
                    pipe.scored = true;
                    score += 1;
                    scoreEl.textContent = score.toString();
                    if (score > bestScore) {
                        bestScore = score;
                        bestEl.textContent = bestScore.toString();
                        localStorage.setItem("flappy-birf-best", bestScore);
                    }
                }

                const inPipeX = BIRD.x + BIRD.radius > pipe.x && BIRD.x - BIRD.radius < pipe.x + SETTINGS.pipeWidth;
                const hitTop = BIRD.y - BIRD.radius < topPipeBottom;
                const hitBottom = BIRD.y + BIRD.radius > bottomPipeTop;

                if (inPipeX && (hitTop || hitBottom)) {
                    gameOver();
                }
            });

            if (BIRD.y + BIRD.radius >= canvas.height - GROUND_HEIGHT) {
                BIRD.y = canvas.height - GROUND_HEIGHT - BIRD.radius;
                gameOver();
            }
        }

        function gameOver() {
            if (state === "dead") {
                return;
            }
            state = "dead";
            updateStatus("Birf bonked!");
            pauseButton.textContent = "Pause";
            cancelAnimationFrame(animationId);
        }

        function renderFrame(timestamp) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawBackground();
            drawPipes();
            drawGround(timestamp);
            drawBird();

            if (state === "ready") {
                drawMessage("Tap to start", "Keep Birf flapping!");
            } else if (state === "dead") {
                drawMessage("Birf bonked!", "Press Start to try again");
            } else if (state === "paused") {
                drawMessage("Paused", "Press Resume to continue");
            }
        }

        function drawBackground() {
            const skyGradient = ctx.createLinearGradient(0, 0, 0, canvas.height - GROUND_HEIGHT);
            skyGradient.addColorStop(0, "rgba(255, 255, 255, 0.65)");
            skyGradient.addColorStop(1, "rgba(135, 206, 235, 0.95)");
            ctx.fillStyle = skyGradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height - GROUND_HEIGHT);

            ctx.fillStyle = "rgba(255, 255, 255, 0.45)";
            for (let i = 0; i < 8; i++) {
                const cloudX = (i * 70 + (performance.now() / 20)) % (canvas.width + 140) - 140;
                const cloudY = 40 + (i % 3) * 40;
                ctx.beginPath();
                ctx.ellipse(cloudX, cloudY, 40, 20, 0, 0, Math.PI * 2);
                ctx.ellipse(cloudX + 25, cloudY + 5, 30, 18, 0, 0, Math.PI * 2);
                ctx.ellipse(cloudX - 20, cloudY + 8, 22, 14, 0, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function drawPipes() {
            pipes.forEach(pipe => {
                const halfGap = SETTINGS.pipeGap / 2;
                const topPipeHeight = pipe.gapCenter - halfGap;
                const bottomPipeY = pipe.gapCenter + halfGap;

                ctx.fillStyle = COLORS.pipe;
                ctx.fillRect(pipe.x, 0, SETTINGS.pipeWidth, topPipeHeight);
                ctx.fillRect(pipe.x - 6, topPipeHeight - 16, SETTINGS.pipeWidth + 12, 16);

                ctx.fillRect(pipe.x, bottomPipeY, SETTINGS.pipeWidth, canvas.height - GROUND_HEIGHT - bottomPipeY);
                ctx.fillRect(pipe.x - 6, bottomPipeY, SETTINGS.pipeWidth + 12, 16);

                ctx.fillStyle = COLORS.pipeDark;
                ctx.fillRect(pipe.x + SETTINGS.pipeWidth - 10, 0, 10, topPipeHeight);
                ctx.fillRect(pipe.x + SETTINGS.pipeWidth - 10, bottomPipeY, 10, canvas.height - GROUND_HEIGHT - bottomPipeY);
            });
        }

        function drawGround(timestamp) {
            const wave = Math.sin(timestamp / 200) * 4;
            ctx.fillStyle = COLORS.grass;
            ctx.fillRect(0, canvas.height - GROUND_HEIGHT + wave, canvas.width, 20);
            ctx.fillStyle = COLORS.ground;
            ctx.fillRect(0, canvas.height - GROUND_HEIGHT + 20 + wave, canvas.width, GROUND_HEIGHT - 20 - wave);
        }

        function drawBird() {
            ctx.save();
            ctx.translate(BIRD.x, BIRD.y);
            const rotation = Math.max(-0.6, Math.min(0.6, BIRD.velocity / 10));
            ctx.rotate(rotation);

            ctx.fillStyle = COLORS.bird;
            ctx.beginPath();
            ctx.ellipse(0, 0, BIRD.radius + 4, BIRD.radius, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = COLORS.wing;
            ctx.beginPath();
            ctx.ellipse(-8, 4, 14, 8, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = COLORS.eye;
            ctx.beginPath();
            ctx.arc(10, -6, 4, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "#f97316";
            ctx.beginPath();
            ctx.moveTo(18, 0);
            ctx.lineTo(28, -4);
            ctx.lineTo(18, -8);
            ctx.closePath();
            ctx.fill();

            ctx.restore();
        }

        function drawMessage(title, subtitle) {
            ctx.save();
            ctx.fillStyle = "rgba(15, 23, 42, 0.65)";
            ctx.roundRect(canvas.width * 0.15, canvas.height * 0.25, canvas.width * 0.7, 120, 18);
            ctx.fill();

            ctx.fillStyle = "white";
            ctx.font = "bold 28px Inter";
            ctx.textAlign = "center";
            ctx.fillText(title, canvas.width / 2, canvas.height * 0.34);

            ctx.font = "17px Inter";
            ctx.fillText(subtitle, canvas.width / 2, canvas.height * 0.39 + 36);
            ctx.restore();
        }

        CanvasRenderingContext2D.prototype.roundRect = function (x, y, width, height, radius) {
            if (typeof radius === "number") {
                radius = { tl: radius, tr: radius, br: radius, bl: radius };
            } else {
                const defaultRadius = { tl: 0, tr: 0, br: 0, bl: 0 };
                for (const side in defaultRadius) {
                    radius[side] = radius[side] || defaultRadius[side];
                }
            }

            this.beginPath();
            this.moveTo(x + radius.tl, y);
            this.lineTo(x + width - radius.tr, y);
            this.quadraticCurveTo(x + width, y, x + width, y + radius.tr);
            this.lineTo(x + width, y + height - radius.br);
            this.quadraticCurveTo(x + width, y + height, x + width - radius.br, y + height);
            this.lineTo(x + radius.bl, y + height);
            this.quadraticCurveTo(x, y + height, x, y + height - radius.bl);
            this.lineTo(x, y + radius.tl);
            this.quadraticCurveTo(x, y, x + radius.tl, y);
            this.closePath();
            return this;
        };

        document.addEventListener("keydown", event => {
            if (event.code === "Space") {
                event.preventDefault();
                flap();
            }
        });

        canvas.addEventListener("pointerdown", flap);
        startButton.addEventListener("click", startGame);
        pauseButton.addEventListener("click", handlePauseClick);

        resetGame();
    </script>
</body>
</html>
